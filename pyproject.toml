[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-api"
version = "1.0.0"
description = "REST API and CLI to create, manage and monitor Kubernetes Deployments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "kubernetes>=31.0.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# `pip install -e .` puts a `deploy` command on the PATH
[project.scripts]
deploy = "cli.deploy:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]
